[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailinsight"
version = "0.1.0"
description = "商超会员用户画像与决策支持系统（数据分析作品集项目）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "mlxtend>=0.23",
    "streamlit>=1.30",
    # 以下 4 项曾被漏声明（v3.4 修复）：缺 duckdb 则 `--stage all` 在 warehouse 崩、
    # 缺 plotly 则看板启动即崩、缺 shap 则逐会员归因静默清空（不报错，只是列全空）。
    # 它们是**主链路必经**，因此必须进主依赖，不能放可选组。
    "duckdb>=1.0",
    "plotly>=5.18",
    "shap>=0.44",
    # CLV 主口径 BG/NBD + Gamma-Gamma（v3.7）。放主依赖的理由与上面三项相同：
    # `profile` stage 必经。缺失时会**显式降级**到简化法（clv_method=simple_fallback），
    # 不会静默产出空列。
    "lifetimes>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "psutil>=5.9"]
# lightgbm 是可**显式降级**的可选依赖：缺失时自动退 sklearn HistGB，
# 并在 metrics_churn.json 的 backend 字段留痕（见 models/churn.py 顶部）。
lgbm = ["lightgbm>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 覆盖率门禁**不放在 addopts 里**：放在 addopts 会让 `pytest tests/xxx.py`
# 这种单文件/单用例运行必然因「总覆盖率 0%」而红（v3.6 修）。门禁保留在
# `make test` / `make cov`（见 Makefile）与 CI 上，作用于**全量**运行。
addopts = "-q --cov=retailinsight --cov-report=term-missing"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["retailinsight*"]
