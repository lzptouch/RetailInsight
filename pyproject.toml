[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailinsight"
version = "0.1.0"
description = "商超会员用户画像与决策支持系统（数据分析作品集项目）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "mlxtend>=0.23",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
lgbm = ["lightgbm>=4.0"]
# P1 阶段才会用到的可选依赖（数据集接入 / DuckDB 星型模型），不进主依赖以免虚增安装体积
p1 = ["duckdb>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=retailinsight --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["retailinsight*"]
